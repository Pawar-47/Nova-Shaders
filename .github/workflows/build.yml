name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.11.0

          A compact shader pack for Minecraft Java 1.21.5 with Iris 1.8.x and Sodium.
          The target is an Intel Core i3-5005U with Intel HD Graphics 5500, but appearance and
          performance have not been verified on that hardware. MIT-licensed adaptations from
          Glimmer and Spectrum are documented in THIRD-PARTY-NOTICES.txt.

          ### Highlights

          - Leaves and vines moved to block ID 103 and are no longer displaced in the vertex
            stage. They are full cubes, so the previous per-vertex lean sheared every leaf block
            away from the six beside it; only the crossed-quad plants on ID 101 bend now.
          - Foliage gains world-space normal relief and a chlorophyll backlight through its shaded
            side, and logs on ID 104 gain a vertically stretched bark relief.
          - Shadow filtering is an eight-tap golden-angle spiral with a smoothstep comparison
            band and a radius that grows with distance and with the angle to the light, replacing
            a fixed 2x2 grid that could only ever return five coverage levels.
          - colortex0 is RGBA16F, so the sun disc, moonlight, water glitter and emissive blocks
            keep their range through the tonemapper, and a two-ring bloom collects everything
            brighter than white. Bloom strength 0.0 removes the pass entirely.
          - Clouds shade from the density field's own gradient along the light direction, and the
            slab intersection now rejects the segment behind the camera instead of marching it.
          - Water normals fade with distance rather than view incidence, so grazing angles keep
            their detail and the sun path, and the displaced surface is biased to dip below the
            water plane so it cannot open a gap at a shoreline.

          ### Not benchmarked

          The sources have not been GPU-compiled, visually checked in Minecraft, or benchmarked.
          The static checker does not establish GPU compatibility or visual quality. No frame-rate
          claims are made. The eight-tap shadow filter and the bloom are the two new costs; Bloom
          0.0 and Shadow softness 0.5 are the fastest way to see what they take.

          ### Worth testing first

          A leaf canopy and a tree trunk close up, a shadow edge near and far, the sun near the
          horizon, and the water shoreline; then the cloud horizon, translucent entities, rain,
          the Nether, and performance on the target GPU.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
