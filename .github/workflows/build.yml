name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.2.0

          An original, MIT licensed shader pack for Iris, written for low end hardware.
          One shadow map with four filtered taps, one procedural noise field, and a two
          pass post chain instead of a deferred pipeline. 0.2.0 is a visual and
          performance pass on the first release.

          ### Changed in 0.2.0

          - The heavy blue cast is gone. Ambient light is near neutral instead of being
            sampled straight out of the sky gradient, the sky palette is much less
            saturated, fog is a desaturated air colour rather than a copy of the sky,
            reflections are pulled towards grey, and the composite carries a very small
            warm balance. Textures read as their own colour now
          - Clouds are small scattered puffs: a low frequency cluster mask decides where
            the cloud banks are at all, and a higher frequency field cuts each bank into
            puffs. Most of the sky is empty
          - Water has five swells set a few degrees apart with irrational wavelength
            ratios and their own speeds, plus two fine ripples that fade out with
            distance. No grid, no repetition, no shimmer on the horizon
          - Smoother and cheaper. The sky gradient was evaluated three times per pixel in
            0.1.0 and is now zero for opaque pixels and one for sky and water; pow() is
            out of the hot paths, the cloud sheet uses fewer octaves, and the water
            normal costs a handful of cosines instead of twelve noise hashes
          - Exposure defaults to 1.0 and the vignette is softer

          ### In this release

          - Sun and moon directional lighting with a shadow map: four filtered taps,
            slope scaled bias, normal offset, distance fade, and an option to switch it
            off entirely
          - Procedural sky: vertical gradient, sunset band that follows the sun, sun disc
            and moon disc, with scattered cloud puffs over it
          - Exponential height fog with an altitude falloff and a desaturated air colour
          - Water with layered directional waves, Schlick Fresnel, a desaturated sky
            reflection and a sun glint. Ice and stained glass share the model
          - ACES tonemapping with exposure, saturation and contrast, plus an underwater tint
          - FXAA, a subtle vignette and an ordered dither
          - Three option screens (Color, Scene, Quality) and two presets, DEFAULT and POTATO

          ### Deliberately not in 0.2.0

          - Screen space terrain reflections in water
          - Volumetric clouds
          - Waving foliage
          - Wet surfaces after rain
          - PBR (LabPBR, POM) and parallax
          - Dimension specific skies
          - Stars, moon phases, coloured shadows, SSAO, bloom, TAA

          ### Not benchmarked, and not run on a GPU by its author

          This release is statically checked only: version lines, include resolution,
          conditional balance, and option and language coverage. It has not been
          compiled on a GPU or measured for frame rate. Please report anything that fails
          to load or compile.

          ### Worth testing first

          The scattered clouds at dawn and dusk, water close up and at a distance, shadow
          edges, rain, and the Nether.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
