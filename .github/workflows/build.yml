name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.9.0

          A compact shader pack for Minecraft Java 1.21.5 with Iris 1.8.x and Sodium.
          The exact target GPU and performance have not been verified. MIT-licensed adaptations
          from Glimmer and Spectrum are documented in THIRD-PARTY-NOTICES.txt.

          ### Highlights

          - Iris block ID 100 enables low-amplitude vertex displacement on water, alongside the
            animated wave normal and depth-based water body. WATER_WAVE_HEIGHT controls both.
          - Iris tag ID 101 adds gentle world-anchored sway to leaves, flowers, saplings and crops;
            the same offset is used by the shadow pass.
          - Cloud coverage and absorption are stronger, with four cloud samples by default.
            POTATO keeps clouds and shadows enabled at three samples and a 512-pixel shadow map
            with a 48-block range; both can still be disabled manually for performance.
          - Daylight direct light and sky/ground ambient contrast are stronger; separate red, green
            and blue controls remain available in the Color settings.
          - Terrain cutouts retain distance-faded alpha-coverage dithering, matched in the shadow pass.

          ### Not benchmarked

          The sources have not been GPU-compiled, visually checked in Minecraft, or benchmarked.
          The static checker does not establish GPU compatibility or performance. No frame-rate
          claims are made.

          ### Worth testing first

          Water surface movement and reflections near and far; vegetation motion and matching
          shadows; cloud edges and shading at noon and sunset; translucent entities, rain, and the
          Nether; and performance on the exact target GPU.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
