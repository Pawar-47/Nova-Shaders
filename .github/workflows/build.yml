name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Check the optional foliage resource pack
        run: python3 tools/check_foliage_pack.py

      - name: Package the shader and companion packs
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Upload the optional foliage resource pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-natural-foliage-${{ steps.version.outputs.value }}
          path: build/nova-natural-foliage-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.10.2

          A compact shader pack for Minecraft Java 1.21.5 with Iris 1.8.x and Sodium.
          The target is an Intel Core i3-5005U with Intel HD Graphics 5500 on Linux Mint, but appearance and
          performance have not been verified on that hardware. MIT-licensed adaptations from
          Glimmer and Spectrum are documented in THIRD-PARTY-NOTICES.txt.

          ### Highlights

          - A separate optional Nova Natural Foliage Lite resource pack adds one randomized leaf-textured plane per vanilla leaf block and a grass-block side fringe to soften square silhouettes. It is packaged separately from the shader ZIP and is not enabled automatically.
          - Cloud sampling uses a denser near-view field to separate overhead cloud islands, then fades to a broader field near the horizon; the target is roughly 15–20 asymmetric masses across a typical overhead open-sky view. The detail field follows the same skewed domain without adding ray-march samples.
          - Horizontal water retains at least 82% opacity and increases opacity with depth, avoiding a clear-glass appearance.
          - The default shadow map is 512px over 64 blocks for the Intel HD 5500 target; 1024px remains available.
          - Foliage shading adds subtle warm/cool variation and sunset-aware backlighting while preserving biome tint.
          - Vegetation sway is anchored at each sprite's base using Iris's mc_midTexCoord, so a
            plant leans from its roots instead of sliding as a rigid quad, and the shadow pass
            bends the cast shadow by the identical weight.
          - block.properties keeps the Iris tag form and adds an explicit 1.21.5 leaf, plant,
            flower, sapling and crop fallback list, so the vegetation block ID cannot silently go
            unassigned on a loader without tag support.
          - Block ID 102 keeps grass blocks on top-face colour variation only; full cubes are not
            sheared by the wind.
          - The README now records this pipeline's ceilings - four cloud samples over a long slab,
            four shadow taps, no SSAO or bloom, an 8-bit colour buffer, display-space shading and
            vanilla 16x textures - so a look difference is not mistaken for a missing option.

          ### Not benchmarked

          The sources have not been GPU-compiled, visually checked in Minecraft, or benchmarked.
          The static checker does not establish GPU compatibility or visual quality. No frame-rate
          claims are made.

          ### Worth testing first

          One grass tuft and one leaf block close up, to see whether they bend rather than shear and
          whether the shadow keeps up; then a grass field, the cloud horizon, translucent entities,
          rain, the Nether, and performance on the target GPU.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            "build/nova-natural-foliage-${{ steps.version.outputs.value }}.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
