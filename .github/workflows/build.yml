name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.8.0

          A compact shader pack for Minecraft Java 1.21.5 with Iris 1.8.x and Sodium.
          This release includes limited MIT-licensed adaptations from Glimmer and Spectrum;
          see THIRD-PARTY-NOTICES.txt. The exact target GPU and performance have not been verified.

          ### Highlights

          - World-anchored water waves combine two analytic directional slopes and a fine noise
            octave. WATER_WAVE_HEIGHT controls the waves, and the view-angle fade approaches world up.
          - Horizontal water sheets use per-channel Beer-Lambert attenuation, restrained
            in-scattering and depth-derived opacity. Vertical translucent surfaces keep their
            separate blending path.
          - Clouds use a height-profiled slab and a compact anisotropic scattering term, without
            secondary light marches. The default is four cloud steps; POTATO uses three.
          - Terrain cutouts use distance-faded alpha-coverage dithering, matched in the shadow pass.
            Other opaque programs keep their low cutoff; translucent entities retain alpha for blending.
          - Daylight ambient and sky colours are less blue; separate red, green and blue controls
            remain available in the Color settings.

          ### Not benchmarked

          The sources have not been GPU-compiled, visually checked in Minecraft, or benchmarked.
          The repository includes a static checker, but passing it does not establish GPU
          compatibility or performance. No frame-rate claims are made.

          ### Worth testing first

          Cloud edges and shading at noon and sunset; water near and far, shallow and deep, and
          underwater; translucent entities, leaves and their shadows; rain; and the Nether.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
