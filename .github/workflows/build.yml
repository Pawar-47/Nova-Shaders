name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.11.0

          A compact shader pack for Minecraft Java 1.21.5 with Iris 1.8.x and Sodium.
          The target is an Intel Core i3-5005U with Intel HD Graphics 5500 on Linux Mint, but appearance and
          performance have not been verified on that hardware. MIT-licensed adaptations from
          Glimmer and Spectrum are documented in THIRD-PARTY-NOTICES.txt.

          ### Highlights

          - Leaves and vines sit on block ID 103 and are displaced by a continuous
            world-space wind field rather than the plant hinge, so vertices shared by
            adjoining leaf cubes get the same offset and a canopy cannot open a crack.
            Ground plants keep the sprite-midpoint hinge on ID 101, which a full cube
            must never use.
          - Foliage gains world-space normal relief, warm/cool patch variation and a
            stronger chlorophyll backlight; logs on ID 104 gain a bark relief.
          - Shadow filtering is an eight-tap golden-angle spiral with a smoothstep
            comparison band and a radius that grows with distance and with the angle
            to the light, replacing a fixed 2x2 grid that could only return five
            coverage levels.
          - colortex0 is RGBA16F, so the sun disc, moonlight, water glitter and
            emissive blocks keep their range through the tonemapper, and a two-ring
            bloom collects everything brighter than white. Bloom 0.0 removes the pass.
          - Clouds shade from the density field's own gradient along the light
            direction, inside the same skewed domain that broadens the islands, and the
            slab intersection no longer marches the air behind the camera.
          - Water normals fade with distance rather than view incidence, so grazing
            angles keep their detail and the sun path, and the displaced surface is
            biased to dip below the water plane so it cannot open a shoreline gap.
          - Keeps the 0.10.4 budgets: 512px shadows over 64 blocks by default, a
            PERFORMANCE preset that disables the shadow pass and FXAA, and the 0.82
            horizontal water opacity floor.

          ### Not benchmarked

          The sources have not been GPU-compiled, visually checked in Minecraft, or benchmarked.
          The static checker does not establish GPU compatibility or visual quality. No frame-rate
          claims are made. The eight-tap shadow filter and the bloom are the two new costs; Bloom
          0.0 and Shadow softness 0.5 are the fastest way to see what they take.

          ### Worth testing first

          A leaf canopy and a tree trunk close up, a shadow edge near and far, the sun near the
          horizon, and the water shoreline; then the cloud horizon, translucent entities, rain,
          the Nether, and performance on the target GPU.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
