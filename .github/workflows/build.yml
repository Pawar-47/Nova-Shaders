name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

jobs:
  build:
    name: Check, package and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'VERSION must look like 1.2.3, got "%s"\n' "$version" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check the shader sources
        run: bash tools/check_shaders.sh

      - name: Package the shader pack
        run: bash tools/package.sh

      - name: Upload the shader pack
        uses: actions/upload-artifact@v4
        with:
          name: nova-shaders-${{ steps.version.outputs.value }}
          path: build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip
          if-no-files-found: error

      - name: Publish release v${{ steps.version.outputs.value }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"

          # Additive only. An existing release keeps its tag and its assets, so a
          # tag is never moved under anyone who already downloaded it. Bump
          # VERSION to publish a new release.
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release %s already exists, leaving it untouched\n' "$tag"
            exit 0
          fi

          # Release notes are written per version: refresh this block whenever
          # VERSION changes, so an old version's notes are not reused.
          notes="$RUNNER_TEMP/nova-shaders-notes.md"
          cat > "$notes" <<'NOTES'
          ## Nova Shaders 0.7.0

          An original, MIT licensed shader pack for Iris, written for low end hardware.
          One shadow map with four filtered taps, one procedural noise field, and a two
          pass post chain instead of a deferred pipeline. 0.7.0 rebuilds the clouds as a marched
          slab and the water around the reference surface model.

          ### Changed in 0.7.0

          - Clouds are a marched slab, not a painted dome. The view ray is intersected with a
            60 block slab and walked in CLOUD_STEPS steps, accumulating transmittance and light
            front to back, so back puffs hide behind front ones and each puff carries a
            continuous tone instead of one flat colour. Coverage is height dependent: dense at
            the base for flat continuous bottoms, eroded towards the top so the crowns separate
            into rounded puffs. Lighting is analytic per sample with forward scattering near the
            sun, and the alpha is softened with a square root so the skirt fades rather than
            being cut. The domain warp is gone, which is what was making them shear and swim
          - Water follows the reference surface model: three octaves of analytic noise gradient
            slope summed into one tilt with a single flatness value, flattened by incidence so
            it mirrors at grazing angles without a distance fade. Squared Fresnel with a 0.75
            ceiling, sky only reflection, a soft eleven degree glitter disc, a dark teal body
            lit from the flat normal, and the reference depth curve for transparency
          - CLOUD_OCTAVES is replaced by CLOUD_STEPS, the march budget: 4 on POTATO, 5 by
            default, up to 8

          ### Carried over from 0.6.0

          - Clouds are small lopsided puffs spread over the whole sky. The old field used
            cells about a hundred blocks across and a large scale mask that grouped them into
            banks, which is why the sky overhead looked empty: looking up only spans a couple
            of hundred blocks, so barely two cells, and the mask had usually emptied it while
            the horizon packed thousands of blocks into a few degrees. The mask is gone, the
            cells are about forty blocks, and the threshold cuts the field into separate
            islands spread evenly, each warped so it is not round. They drift four times
            faster
          - Water is translucent, not transparent. The alpha no longer follows whatever
            vanilla handed the program: a horizontal sheet sits at 0.68 over a shallow bottom
            and 0.94 once it is deep, so the bottom shows through tinted rather than clear.
            Vertical faces keep a floor of 0.62, so waterfalls and glass panes still read
            right

          ### Carried over from 0.5.0

          - Water detail is noise now, not only sines. Three swell trains carry the large
            motion and the gradient of a noise field at about one block per cell supplies
            the high frequency chop that actually reads as water, faded with distance so
            far water does not turn into pixel noise
          - The water reflection now includes the sun and moon discs, so the sun path
            appears on the surface, and the glint is a broad sheen under a tight sparkle
            instead of a single flat dot
          - Clouds are domain warped by the cluster field, which turns round blobs into
            billows, and a second sample towards the sun drives a stronger lit/shade split
            plus a silver lining on the edges facing the light
          - Fog is much lighter: about 10% at 100 blocks instead of 40%, with a squared
            distance term taking over further out, and caves no longer mist up

          ### Carried over from 0.4.0

          - Clouds have depth. A second density sample, taken towards the sun, shades every
            puff: light facing edges glow, thick cores go grey. Coverage is higher by
            default and near the horizon the noise is averaged towards its mean instead of
            fading out, so there is a deck down to the skyline without shimmer
          - Water is a body now. The opaque depth buffer tells the water how deep it is, the
            body colour absorbs into a dark teal and the alpha closes up with depth:
            shallow water shows the bottom, a lake is close to opaque. Waves are 25% taller
          - Vegetation cutout edges ride a stable ordered dither, and the threshold rises
            with distance so single texels stop popping in and out as the camera moves
          - Lighting wraps. A small wrap softens every terminator, and ambient is now a
            hemisphere: cool skylight from above, warm bounce from the ground

          ### Carried over from 0.3.0

          - Red, green and blue can be adjusted separately. COLOR_RED, COLOR_GREEN and
            COLOR_BLUE are on the Color screen and all three are sliders. They multiply
            the image in linear light before the tonemapper, so they behave like a real
            channel correction: 1.0 leaves a channel alone, lower pulls it back, higher
            pushes it. The small fixed white balance that keeps daylight neutral stays
            underneath them, so the defaults look exactly like 0.2.0

          ### Carried over from 0.2.0

          - The heavy blue cast is gone: neutral ambient light, a much less saturated sky,
            a desaturated fog colour and reflections pulled towards grey
          - Clouds are small scattered puffs from a cluster mask over an FBM field
          - Water is five swells with irrational wavelength ratios plus two fine ripples
            that fade out with distance
          - Cheaper per pixel: no sky gradient evaluation for opaque geometry, and no
            pow() in the hot paths

          ### In this release

          - Sun and moon directional lighting with a shadow map: four filtered taps,
            slope scaled bias, normal offset, distance fade, and an option to switch it
            off entirely
          - Procedural sky: vertical gradient, sunset band that follows the sun, sun disc
            and moon disc, with volume shaded cloud puffs over it
          - Exponential height fog with an altitude falloff and a desaturated air colour
          - Water with layered directional waves, Schlick Fresnel, a desaturated sky
            reflection and a sun glint, over a body that absorbs with depth. Ice and
            stained glass share the model
          - ACES tonemapping with exposure, saturation and contrast, plus an underwater tint
          - FXAA, a subtle vignette and an ordered dither
          - Three option screens (Color, Scene, Quality) and two presets, DEFAULT and POTATO

          ### Deliberately not in 0.7.0

          - Screen space terrain reflections in water
          - Volumetric clouds
          - Waving foliage
          - Wet surfaces after rain
          - PBR (LabPBR, POM) and parallax
          - Dimension specific skies
          - Stars, moon phases, coloured shadows, SSAO, bloom, TAA

          ### Not benchmarked, and not run on a GPU by its author

          This release is statically checked only: version lines, include resolution,
          conditional balance, and option and language coverage. It has not been
          compiled on a GPU or measured for frame rate. Please report anything that fails
          to load or compile.

          ### Worth testing first

          Cloud silhouettes and their bases, cloud shading at noon and through a sunset, water
          from above and from the shore and underwater, shallow against deep water, the sun
          glitter path, glass panes and waterfalls, rain, and the Nether.
          NOTES

          gh release create "$tag" \
            "build/nova-shaders-${{ steps.version.outputs.value }}-shaderpack.zip" \
            --title "Nova Shaders $tag" \
            --notes-file "$notes"
