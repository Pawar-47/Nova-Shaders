# Nova Shaders - pack level configuration.
#
# The options themselves live in lib/settings.glsl. This file only says how the
# Shader Pack Settings screen is laid out, which options become sliders, and
# what the shipped presets set.
#
# Layout tokens: OPTION, [SUBSCREEN], <profile>, <empty>, *

screen = <empty> <profile> [COLOR] [SCENE] [QUALITY] *
screen.columns = 3

# Iris evaluates these properties after shader-option preprocessing. This really
# disables the shadow render pass, not merely the four fragment lookups.
#if SHADOWS == 0
shadow.enabled = false
#else
shadow.enabled = true
#endif

screen.COLOR = COLOR_EXPOSURE COLOR_SATURATION COLOR_CONTRAST COLOR_RED COLOR_GREEN COLOR_BLUE COLOR_VIGNETTE COLOR_DITHER ANTI_ALIASING BLOOM_STRENGTH
screen.SCENE = SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_HEIGHT CLOUDS CLOUD_COVERAGE CLOUD_ALTITUDE WATER_WAVES WATER_WAVE_HEIGHT UNDERWATER_TINT
screen.QUALITY = SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance CLOUD_STEPS

# Sliders may be listed for options from any screen, they still appear where the
# screen list above puts them.
sliders = COLOR_EXPOSURE COLOR_SATURATION COLOR_CONTRAST COLOR_RED COLOR_GREEN COLOR_BLUE COLOR_VIGNETTE BLOOM_STRENGTH SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH FOG_DENSITY FOG_HEIGHT CLOUD_COVERAGE CLOUD_ALTITUDE WATER_WAVE_HEIGHT SHADOW_SOFTNESS

# DEFAULT: full visual quality, on the HD 5500 budget.
profile.DEFAULT = COLOR_EXPOSURE=1.0 COLOR_SATURATION=1.0 COLOR_CONTRAST=1.0 COLOR_RED=1.0 COLOR_GREEN=1.0 COLOR_BLUE=1.0 COLOR_VIGNETTE=0.15 COLOR_DITHER=1 ANTI_ALIASING=1 BLOOM_STRENGTH=0.30 SUN_STRENGTH=1.0 AMBIENT_STRENGTH=1.0 BLOCKLIGHT_STRENGTH=1.0 FOG_DENSITY=1.0 FOG_HEIGHT=64.0 CLOUDS=1 CLOUD_COVERAGE=0.45 CLOUD_ALTITUDE=180.0 CLOUD_STEPS=4 WATER_WAVES=1 WATER_WAVE_HEIGHT=1.5 UNDERWATER_TINT=1 SHADOWS=1 SHADOW_SOFTNESS=1.0 shadowMapResolution=512 shadowDistance=64.0

# POTATO keeps the visual effects with fewer cloud samples and short, low-resolution shadows.
profile.POTATO = COLOR_EXPOSURE=1.0 COLOR_SATURATION=1.0 COLOR_CONTRAST=1.0 COLOR_RED=1.0 COLOR_GREEN=1.0 COLOR_BLUE=1.0 COLOR_VIGNETTE=0.15 COLOR_DITHER=1 ANTI_ALIASING=1 BLOOM_STRENGTH=0.20 SUN_STRENGTH=1.0 AMBIENT_STRENGTH=0.85 BLOCKLIGHT_STRENGTH=1.0 FOG_DENSITY=0.5 FOG_HEIGHT=64.0 CLOUDS=1 CLOUD_COVERAGE=0.45 CLOUD_ALTITUDE=180.0 CLOUD_STEPS=3 WATER_WAVES=1 WATER_WAVE_HEIGHT=1.5 UNDERWATER_TINT=1 SHADOWS=1 SHADOW_SOFTNESS=1.0 shadowMapResolution=512 shadowDistance=48.0

# PERFORMANCE removes the shadow pass, FXAA and the bloom pass while keeping the sky and water effects.
profile.PERFORMANCE = COLOR_EXPOSURE=1.0 COLOR_SATURATION=1.0 COLOR_CONTRAST=1.0 COLOR_RED=1.0 COLOR_GREEN=1.0 COLOR_BLUE=1.0 COLOR_VIGNETTE=0.0 COLOR_DITHER=1 ANTI_ALIASING=0 BLOOM_STRENGTH=0.0 SUN_STRENGTH=1.0 AMBIENT_STRENGTH=0.85 BLOCKLIGHT_STRENGTH=1.0 FOG_DENSITY=0.5 FOG_HEIGHT=64.0 CLOUDS=1 CLOUD_COVERAGE=0.45 CLOUD_ALTITUDE=180.0 CLOUD_STEPS=3 WATER_WAVES=1 WATER_WAVE_HEIGHT=1.0 UNDERWATER_TINT=1 SHADOWS=0 SHADOW_SOFTNESS=1.0 shadowMapResolution=512 shadowDistance=48.0
