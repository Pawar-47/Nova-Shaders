# Stable IDs exposed through mc_Entity in the terrain, water and shadow vertex programs.
block.100 = minecraft:water

# Vegetation: leaves, flowers, saplings, crops and the ground plants that have no
# useful block ID of their own. Iris 1.6+ exposes vanilla block tags, so the tag
# form picks up new plants without an edit. The #else branch is the explicit list
# for a loader without tag support, otherwise vegetation would silently keep its
# vanilla geometry: no sway, no shadow bend, no foliage shading.
#ifdef IRIS_TAG_SUPPORT
block.101 = %minecraft:leaves %minecraft:flowers %minecraft:tall_flowers %minecraft:saplings %minecraft:crops minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush minecraft:seagrass minecraft:tall_seagrass minecraft:vine minecraft:bush minecraft:firefly_bush
#else
block.101 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves minecraft:pale_oak_leaves minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush minecraft:seagrass minecraft:tall_seagrass minecraft:vine minecraft:bush minecraft:firefly_bush minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:torchflower minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:wildflowers minecraft:closed_eyeblossom minecraft:open_eyeblossom minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling minecraft:jungle_sapling minecraft:acacia_sapling minecraft:dark_oak_sapling minecraft:cherry_sapling minecraft:pale_oak_sapling minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush
#endif

# Grass blocks get their own ID. Only the top face is tinted, and the geometry
# stays put: shearing a full cube around its sprite midpoint reads as a wobbling
# block, which is exactly what a grass field must not do.
block.102 = minecraft:grass_block
