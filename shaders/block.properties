# Stable IDs exposed through mc_Entity in the terrain, water and shadow vertex programs.
block.100 = minecraft:water

# Plants: the crossed-quad and flat-quad models (grass, ferns, flowers, saplings,
# crops, sugar cane, kelp). These are the only blocks this pack deforms with the
# sprite-midpoint hinge, because a crossed quad has no volume to tear: the base
# stays planted and the top leans.
#
# Iris 1.6+ exposes vanilla block tags, so the tag form picks up new plants
# without an edit. The #else branch is the explicit list for a loader without tag
# support, otherwise vegetation would silently keep its vanilla geometry: no
# sway, no shadow bend, no foliage shading.
#
# small_flowers rather than flowers on purpose: the wider flowers tag also holds
# flowering azalea, chorus flower, spore blossom and pink petals, and the first
# two are full cubes. A full cube under the hinge is exactly the shear this split
# is meant to prevent.
#ifdef IRIS_TAG_SUPPORT
block.101 = %minecraft:small_flowers %minecraft:tall_flowers %minecraft:saplings %minecraft:crops minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush minecraft:seagrass minecraft:tall_seagrass minecraft:bush minecraft:firefly_bush minecraft:sugar_cane minecraft:kelp minecraft:kelp_plant
#else
block.101 = minecraft:short_grass minecraft:tall_grass minecraft:fern minecraft:large_fern minecraft:dead_bush minecraft:seagrass minecraft:tall_seagrass minecraft:bush minecraft:firefly_bush minecraft:sugar_cane minecraft:kelp minecraft:kelp_plant minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose minecraft:torchflower minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony minecraft:wildflowers minecraft:closed_eyeblossom minecraft:open_eyeblossom minecraft:oak_sapling minecraft:spruce_sapling minecraft:birch_sapling minecraft:jungle_sapling minecraft:acacia_sapling minecraft:dark_oak_sapling minecraft:cherry_sapling minecraft:pale_oak_sapling minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:sweet_berry_bush
#endif

# Grass blocks get their own ID. Only the top face is tinted and given relief,
# and the geometry stays put: shearing a full cube around its sprite midpoint
# reads as a wobbling block, which is exactly what a grass field must not do.
block.102 = minecraft:grass_block

# Leaves and vines get their own ID because their topology is different: a leaf
# block is six full block faces, not one crossed quad. They are displaced by a
# continuous field rather than the sprite hinge, so vertices shared by adjoining
# leaf cubes receive the same offset and a canopy cannot open a crack. The plant
# hinge would move the top of every face sideways and tear the block away from
# the six around it.
#ifdef IRIS_TAG_SUPPORT
block.103 = %minecraft:leaves minecraft:vine
#else
block.103 = minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves minecraft:pale_oak_leaves minecraft:vine
#endif

# Logs and wood: the trunk. A tree's volume is carried by its bark, and one flat
# texture stretched over one flat cube reads as a painted slab, so the terrain
# stage tilts these normals with a vertically stretched noise field.
#ifdef IRIS_TAG_SUPPORT
block.104 = %minecraft:logs
#else
block.104 = minecraft:oak_log minecraft:spruce_log minecraft:birch_log minecraft:jungle_log minecraft:acacia_log minecraft:dark_oak_log minecraft:mangrove_log minecraft:cherry_log minecraft:pale_oak_log minecraft:oak_wood minecraft:spruce_wood minecraft:birch_wood minecraft:jungle_wood minecraft:acacia_wood minecraft:dark_oak_wood minecraft:mangrove_wood minecraft:cherry_wood minecraft:pale_oak_wood minecraft:stripped_oak_log minecraft:stripped_spruce_log minecraft:stripped_birch_log minecraft:stripped_jungle_log minecraft:stripped_acacia_log minecraft:stripped_dark_oak_log minecraft:stripped_mangrove_log minecraft:stripped_cherry_log minecraft:stripped_pale_oak_log
#endif
